[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "The UIKit calls of the iOS app that the crates forbidding unsafe code can't make"

[dependencies]
# The game window's view, for `describe_window`.
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.5.1"
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSDictionary", "NSError", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString", "NSThread", "NSURL"] }
# Controllers (gilrs has no iOS backend).
objc2-game-controller = { version = "0.2.2", default-features = false, features = [
    "std",
    "GCController",
    "GCControllerAxisInput",
    "GCControllerButtonInput",
    "GCControllerDirectionPad",
    "GCControllerElement",
    "GCDevice",
    "GCDeviceHaptics",
    "GCExtendedGamepad",
    "GCPhysicalInputProfile",
] }
# ProMotion's frame rate (prefer_frame_rate): the version winit's objc2 takes.
objc2-quartz-core = { version = "0.2.2", default-features = false, features = [
    "std",
    "CADisplayLink",
    "CAFrameRateRange",
] }
# The Microsoft sign-in's refresh token (keychain.rs).
security-framework = { version = "3", default-features = false }
objc2-ui-kit = { version = "0.2.2", features = [
    "block2",
    "UIAlertController",
    "UIApplication",
    "UIOrientation",
    "UIResponder",
    "UIScene",
    "UIScreen",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
] }

[lints]
workspace = true
