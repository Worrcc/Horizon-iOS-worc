[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "The UIKit calls of the iOS app that the crates forbidding unsafe code can't make"

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.5.1"
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSString", "NSThread"] }
# Controllers (gilrs has no iOS backend).
objc2-game-controller = { version = "0.2.2", default-features = false, features = [
    "std",
    "GCController",
    "GCControllerAxisInput",
    "GCControllerButtonInput",
    "GCControllerDirectionPad",
    "GCControllerElement",
    "GCDevice",
    "GCExtendedGamepad",
    "GCPhysicalInputProfile",
] }
objc2-ui-kit = { version = "0.2.2", features = [
    "block2",
    "UIAlertController",
    "UIApplication",
    "UIResponder",
    "UIView",
    "UIViewController",
    "UIWindow",
] }

[lints]
workspace = true
