# With no content mod's mob near the player, every order says so.

[[step]]
join = "Alex"
command = "animate walk"
expect.error = "No content mod's mob within 32 blocks"

[[step]]
command = "heel"
expect.feedback = "0 mobs ordered"

# A kind no content mod declares is refused.
[[step]]
command = "raise minecraft:zombie"
expect.error = "minecraft:zombie is not a content mod's mob"


[[step]]
command = "paint none"
expect.error = "No content mod's mob within 32 blocks"

[[step]]
command = "roar"
expect.error = "No content mod's mob within 32 blocks"

[[step]]
command = "attr max_health 500"
expect.error = "No content mod's mob within 32 blocks"

[[step]]
command = "heal 20"
expect.error = "No content mod's mob within 32 blocks"
